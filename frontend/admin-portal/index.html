<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1>Admin Portal</h1>

        <div id="login-section">
            <h2>Login</h2>
            <input id="user" placeholder="Username" />
            <input id="pass" type="password" placeholder="Password" />
            <button id="loginBtn">Login</button>
            <p id="loginError" class="error"></p>
        </div>

        <div id="admin-section" class="hidden">
            <button id="logoutBtn">Logout</button>
            <h2>Admin Dashboard</h2>

            <div class="controls">
                <button id="dashboardBtn">Load all Data</button>
                <button id="paymentsBtn">Load all Payments</button>
            </div>

            <div class="search-box">
                <input id="studentSearch" placeholder="Search Student ID" />
                <button id="searchBtn">Search</button>
            </div>

            <div class="registration-box">
                <h3>Register Student (semester)</h3>
                <input id="reg-userid" placeholder="User ID" />
                <input id="reg-semester" placeholder="Semester" />
                <input id="reg-department" placeholder="Department" />
                <input id="reg-class" placeholder="Class" />
                <button id="createRegBtn">Create Registration</button>
            </div>

            <div id="output" class="output"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
